name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # StrawberryShake's code generator ships as a net9 tool; only the net10 runtime is installed.
  DOTNET_ROLL_FORWARD: Major

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NexusMods.App.sln

      - name: Build (warnings are errors)
        id: build
        # Property form so WarningsNotAsErrors (NuGet audit) in Directory.Build.props is honoured.
        run: dotnet build NexusMods.App.sln --no-restore -p:TreatWarningsAsErrors=true

      - name: Test (xUnit projects)
        run: |
          set -uo pipefail
          failed=()
          for proj in $(grep -rL '"TUnit"' --include='*.Tests.csproj' tests); do
            echo "::group::$proj"
            dotnet test "$proj" --no-build --logger GitHubActions \
              --filter "RequiresNetworking!=True&FlakeyTest!=True" \
              --blame-hang-timeout 10m || failed+=("$proj")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Failing test projects:\n%s\n' "${failed[@]}"
            exit 1
          fi

      - name: Test (TUnit projects)
        if: always() && steps.build.outcome == 'success'
        run: |
          set -uo pipefail
          failed=()
          for proj in $(grep -rl '"TUnit"' --include='*.Tests.csproj' tests); do
            echo "::group::$proj"
            dotnet run --project "$proj" --no-build || failed+=("$proj")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            printf '::error::Failing test projects:\n%s\n' "${failed[@]}"
            exit 1
          fi
